# ============================================================
# SpecRL PPO 训练器配置文件
# ============================================================
# 用途：配置基于推测解码（SpecRL）的 PPO 训练流程
# 关键配置项：
#   - defaults: 继承标准 ppo_trainer 配置
# 与其他 recipe 的区别：在 rollout 阶段启用推测解码，
# 通过 gRPC 后缀缓存服务器加速生成，无需额外 draft 模型。
# ============================================================
hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_
