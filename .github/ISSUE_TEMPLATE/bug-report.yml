# =============================================================================
# bug-report.yml - Bug 报告 Issue 模板
# =============================================================================
# 本文件定义了 GitHub Issue 的 Bug 报告模板。
# 当用户提交 Bug 报告时，需要填写系统信息、复现步骤和预期行为。
# 参考自 HuggingFace Transformers 的 bug-report.yml
# =============================================================================

# modified from https://github.com/huggingface/transformers/blob/main/.github/ISSUE_TEMPLATE/bug-report.yml?plain=1
name: "\U0001F41B Bug Report"
description: Submit a bug report to help us improve verl  # 提交 Bug 报告以帮助改进 verl
labels: [ "bug" ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! 🤗

  - type: textarea
    id: system-info
    attributes:
      label: System Info  # 系统信息
      description: Please share your system info with us. You can run the command `python scripts/diagnose.py` and copy-paste its output below.
      placeholder: verl version, platform, python version, ...
    validations:
      required: true

  - type: checkboxes
    id: information-scripts-examples
    attributes:
      label: Information
      description: 'The problem arises when using:'  # 问题出现的场景
      options:
        - label: "The official example scripts"     # 使用官方示例脚本
        - label: "My own modified scripts"            # 使用自己修改的脚本

  - type: checkboxes
    id: information-tasks
    attributes:
      label: Tasks
      description: "The tasks I am working on are:"  # 正在执行的任务类型
      options:
        - label: "An officially supported task in the `examples` folder (such as GLUE/SQuAD, ...)"
        - label: "My own task or dataset (give details below)"

  - type: textarea
    id: reproduction
    validations:
      required: true
    attributes:
      label: Reproduction  # 复现步骤
      description: |
        Please provide a code sample that reproduces the problem you ran into. It can be a Colab link or just a code snippet.
        Please include relevant config information with your code.
        If you have code snippets, error messages, stack traces please provide them here as well.
        Important! Use code tags to correctly format your code. See https://help.github.com/en/github/writing-on-github/creating-and-highlighting-code-blocks#syntax-highlighting
        Do not use screenshots, as they are hard to read and (more importantly) don't allow others to copy-and-paste your code.

      placeholder: |
        Steps to reproduce the behavior:

          1.
          2.
          3.


  - type: textarea
    id: expected-behavior
    validations:
      required: true
    attributes:
      label: Expected behavior  # 预期行为
      description: "A clear and concise description of what you would expect to happen."