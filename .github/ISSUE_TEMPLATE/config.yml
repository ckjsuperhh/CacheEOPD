# =============================================================================
# config.yml - Issue 模板全局配置
# =============================================================================
# 本文件控制 GitHub Issue 模板的全局行为。
# blank_issues_enabled: true 表示允许用户创建空白 Issue（不使用任何模板）。
# =============================================================================

blank_issues_enabled: true  # 允许创建不使用模板的空白 Issue
version: 0.1                # 配置文件版本
