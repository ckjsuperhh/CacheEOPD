# =============================================================================
# feature-request.yml - 功能请求 Issue 模板
# =============================================================================
# 本文件定义了 GitHub Issue 的功能请求模板。
# 当用户希望新增功能或改进现有功能时使用此模板。
# 需要填写功能描述、动机和贡献方式。
# 参考自 HuggingFace Transformers 的 feature-request.yml
# =============================================================================

# modified from https://github.com/huggingface/transformers/blob/main/.github/ISSUE_TEMPLATE/feature-request.yml?plain=1
name: "\U0001F680 Feature request"
description: Submit a proposal/request for a new verl feature  # 提交新功能提案或请求
labels: [ "Feature request" ]
body:
  - type: textarea
    id: feature-request
    validations:
      required: true
    attributes:
      label: Feature request  # 功能请求描述
      description: |
        A clear and concise description of the feature proposal. Please provide a link to the paper and code in case they exist.

  - type: textarea
    id: motivation
    validations:
      required: true
    attributes:
      label: Motivation  # 提出动机
      description: |
        Please outline the motivation for the proposal. Is your feature request related to a problem? e.g., I'm always frustrated when [...]. If this is related to another GitHub issue, please link here too.


  - type: textarea
    id: contribution
    validations:
      required: true
    attributes:
      label: Your contribution  # 你的贡献方式
      description: |
        Is there any way that you could help, e.g. by submitting a PR? Make sure to read the CONTRIBUTING.MD [readme](https://github.com/volcengine/verl/blob/main/CONTRIBUTING.md)